<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" 
          content="width=device-width, 
                         initial-scale=1.0">
    <title>Login & Signup Form</title>
    <link rel="stylesheet" 
          href="style.css">
</head>

<body>
    <header>
        <h2 class="title"><b>Sliding Login & Registration Form</b></h2>
    </header>

    
    <div class="container">

        
        <div class="slider"></div>
        <div class="btn">
            <button class="login">Login</button>
            <button class="signup">Signup</button>
        </div>

        
        <div class="form-section">

           
            <div class="login-box">
                <input type="email" 
                       class="email ele" 
                       placeholder="Your email">
                <input type="password"
                       class="password ele" 
                       placeholder="Password">
                <button class="clkbtn">Login</button>
            </div>

            
            <div class="signup-box">
                <input type="text" 
                       class="name ele" 
                       placeholder="Enter your name">
                <input type="email" 
                       class="email ele" 
                       placeholder="name123@email.com">
                <input type="password" 
                       class="password ele" 
                       placeholder="Password">
                <input type="password" 
                       class="password ele" 
                       placeholder="Confirm password">
                <button class="clkbtn">Signup</button>
            </div>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
